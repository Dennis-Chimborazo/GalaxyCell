version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: galaxycell_postgres
    restart: always
    environment:
      POSTGRES_DB: galaxycell
      POSTGRES_USER: galaxycell
      POSTGRES_PASSWORD: galaxycell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: