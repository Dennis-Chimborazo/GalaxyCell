{% extends 'base.html' %}
{% load static %}

{% block body %}
<div 
    class="flex min-h-screen w-full" 
    style="background: var(--color-background);"
    x-data="{ sidebarOpen: false }"
>
    <aside
        :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
        class="fixed inset-y-0 left-0 z-50 w-64 transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:w-64 lg:shrink-0 lg:flex lg:flex-col lg:h-screen lg:sticky lg:top-0"
        style="
            background: var(--color-surface);
            border-right: 1px solid var(--color-border);
            box-shadow: 0 10px 30px rgba(15,23,42,.08);
        "
    >
        {% include 'components/sidebar.html' %}
    </aside>

    <div
        x-show="sidebarOpen"
        @click="sidebarOpen = false"
        x-cloak
        class="fixed inset-0 z-40 lg:hidden transition-opacity duration-300"
        style="
            background: rgba(15,23,42,.50);
            backdrop-filter: blur(4px);
        "
    ></div>

    <div class="flex-1 flex flex-col min-w-0">
        
        <header
            class="lg:hidden px-6 py-4 flex items-center justify-between shrink-0"
            style="
                background: var(--color-surface);
                border-bottom: 1px solid var(--color-border);
            "
        >
            <button
                type="button"
                @click="sidebarOpen = true"
                class="p-2 rounded-xl transition-colors"
                style="color: var(--color-text-secondary);"
            >
                <img src="{% static 'icons/hamburger.svg' %}" class="w-7 h-7" alt="Menu">
            </button>

            <span class="text-xl font-black tracking-wider uppercase" style="color: var(--color-primary-dark);">
                Galaxy Cell
            </span>

            <div class="w-7"></div>
        </header>

        <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
            <section
                id="main-content"
                hx-history-elt
                class="min-h-full rounded-3xl p-5 sm:p-8"
                style="
                    background: var(--color-surface);
                    border: 1px solid var(--color-border);
                    box-shadow: 0 8px 30px rgba(15,23,42,.04);
                "
            >
                {% block content %}
                <div
                    id="dashboard-welcome"
                    class="flex flex-col items-center justify-center min-h-[65vh] text-center px-4"
                >
                    <div 
                        class="w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-sm"
                        style="background: rgba(var(--color-primary-rgb, 14, 165, 233), 0.1); border: 1px solid var(--color-border);"
                    >
                        <svg class="w-8 h-8" style="color: var(--color-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0V11m0 0h4m-4 0H3m11 0h5" />
                        </svg>
                    </div>

                    <h2
                        class="text-2xl sm:text-4xl font-extrabold tracking-tight uppercase"
                        style="color: var(--color-primary-dark);"
                    >
                        Galaxy Cell
                    </h2>

                    <p
                        class="mt-3 text-sm sm:text-base font-medium max-w-sm"
                        style="color: var(--color-text-secondary);"
                    >
                        Bienvenido al Panel de Administración del Sistema de Gestión Empresarial.
                    </p>

                    <span 
                        class="mt-6 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold"
                        style="background: var(--color-background); color: var(--color-text-light); border: 1px solid var(--color-border);"
                    >
                        <span class="w-2 w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                        Sesión Activa
                    </span>
                </div>
                {% endblock %}
            </section>
        </main>

    </div>
</div>
{% endblock %}
