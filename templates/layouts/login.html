{% extends "base.html" %}
{% load static %}

{% block title %}
    Iniciar Sesión | Galaxy Cell
{% endblock %}

{% block body %}
<div
    id="login-container"
    class="w-full min-h-screen flex items-center justify-center bg-background relative overflow-hidden px-3 sm:px-6"
>
    <div
        class="absolute -bottom-32 -right-32 w-96 h-96 rounded-full blur-3xl opacity-20"
        style="background: var(--color-primary);"
    ></div>

    <div
        class="absolute -top-32 -left-32 w-96 h-96 rounded-full blur-3xl opacity-20"
        style="background: var(--color-accent);"
    ></div>

    <div class="relative z-10 w-full max-w-md">

        <div class="card bg-[var(--color-surface)] shadow-xl border border-[var(--color-border)] p-5 sm:p-10 rounded-2xl mx-1 sm:mx-0">

            <div class="flex justify-center mb-5 sm:mb-6">
                <img
                    src="{% static 'images/logo.webp' %}"
                    alt="Galaxy Cell"
                    class="w-20 h-20 sm:w-24 sm:h-24 object-contain"
                >
            </div>

            <div class="text-center mb-6 sm:mb-8">
                <h1
                    class="text-2xl sm:text-3xl font-extrabold"
                    style="color: var(--color-primary-dark);"
                >
                    Galaxy Cell
                </h1>
                <p
                    class="mt-1.5 sm:mt-2 text-xs sm:text-sm"
                    style="color: var(--color-text-secondary);"
                >
                    Sistema de Gestión Empresarial
                </p>
            </div>

            <main id="form-container">
                {% block content %}
                    {% include "partials/login-form.html" %}
                {% endblock %}
            </main>

        </div>

        <p
            class="text-center text-[10px] sm:text-xs mt-6 sm:mt-8 tracking-widest uppercase"
            style="color: var(--color-text-light);"
        >
            © 2026 Galaxy Cell
        </p>
    </div>
</div>
{% endblock %}
