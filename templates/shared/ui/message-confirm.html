<div
    x-data="{
        confirmOpen: false,
        confirmUrl: '',
        confirmMessage: '',
        confirmTarget: '#table-results',
        confirmForm: null,
        confirmAction: null
    }"

    @open-confirm.window="
        confirmOpen = true;
        confirmUrl = $event.detail.url || '';
        confirmMessage = $event.detail.message || '';
        confirmTarget = $event.detail.target || '#table-results';
        confirmForm = $event.detail.form || null;
        confirmAction = $event.detail.action || null;
    "
>

    <template x-teleport="body">

        <div
            x-show="confirmOpen"
            x-cloak
            class="fixed inset-0 z-[100000] flex items-center justify-center bg-black/60 backdrop-blur-sm"
        >

            <div
                x-show="confirmOpen"

                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"

                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100"
                x-transition:leave-end="opacity-0"

                @click.away="confirmOpen = false"

                class="modal-card"
            >

                <div class="flex items-center gap-3 mb-4">

                    <div class="modal-icon-warning">

                        <svg
                            class="w-6 h-6"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
                            />
                        </svg>

                    </div>

                    <h2 class="modal-title">
                        Confirmación de Acción
                    </h2>

                </div>

                <p
                    class="modal-text mb-6"
                    x-text="confirmMessage"
                ></p>

                <div class="flex justify-end gap-3">

                    <button
                        type="button"

                        @click="
                            confirmOpen = false;
                            $dispatch('cancel-overwrite');
                        "

                        class="btn btn-secondary"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"

                        class="btn btn-warning"

                        @click="

                            if(confirmAction) {

                                confirmAction();

                            } else if(confirmForm) {

                                document
                                    .getElementById(confirmForm)
                                    .dispatchEvent(
                                        new Event('submit', {
                                            bubbles: true
                                        })
                                    );

                            } else {

                                htmx.ajax(
                                    'POST',
                                    confirmUrl,
                                    {
                                        target: confirmTarget
                                    }
                                );

                            }

                            confirmOpen = false;

                        "
                    >
                        Confirmar
                    </button>

                </div>

            </div>

        </div>

    </template>

</div>
