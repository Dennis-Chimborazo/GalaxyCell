{% load static %}

<div
    x-data="{
        open: false,
        title: '',
        close() {
            this.open = false;
            setTimeout(() => {
                document.body.style.overflow = 'auto';
                // Limpiamos el contenido residual para que no se vea el formulario viejo al reabrir
                const content = document.getElementById('modal-body-content');
                if (content) content.innerHTML = '';
            }, 100);
        }
    }"
    x-show="open"
    x-cloak
    @open-modal.window="
        title = $event.detail.title;
        open = true;
        document.body.style.overflow = 'hidden';
    "
    @close-modal.window="close()"
    @keydown.escape.window="close()"
    class="fixed inset-0 z-[99999] flex items-center justify-center"
>
    <div
        x-show="open"
        x-transition:enter="transition ease-out duration-200"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="close()"
        class="modal-overlay"
    ></div>

    <div
        x-show="open"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 scale-95"
        x-transition:enter-end="opacity-100 scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="modal-container"
    >
        <div class="modal-header">
            <h2 class="modal-title" x-text="title">Acción</h2>
            <button
                @click="close()"
                class="modal-close"
                type="button"
            >
                <img
                    src="{% static 'icons/exit.svg' %}"
                    class="w-5 h-5"
                    alt="Cerrar"
                >
            </button>
        </div>

       <div class="modal-body relative min-h-[150px]">
    
    <div
        id="modal-loader"
        class="htmx-indicator hidden [&.htmx-request]:flex absolute inset-0 bg-white/70 flex-col items-center justify-center z-10"
    >
        <div class="loader-spinner"></div>
        <p class="loader-text mt-2 text-sm text-gray-500">Cargando...</p>
    </div>

    <div id="modal-body-content"></div>
</div>
    </div>
</div>
